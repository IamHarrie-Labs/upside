# Envio HyperIndex config for Upside.
# Envio HyperIndex v3. Fill the addresses from contracts/deployments/<chainId>.json after deploying, then:
#   npm install && npx envio codegen && npx envio dev   (Linux/macOS/WSL; the CLI has no native Windows build)
name: upside
chains:
  - id: 10143
    start_block: 68624497
    contracts:
      - name: CallBook
        address: ["0x618861b1935bc2C2dB6d7F75cA6F3dfC81aac317"]
        handler: src/EventHandlers.ts
        events:
          - event: CallPosted(uint256 indexed id, address indexed caller, address base, address quote, uint8 side, uint256 entryMid, uint256 targetMid, uint256 stopMid, uint16 feeBps, uint40 expiry, bool verified)
          - event: CallScored(uint256 indexed id, address indexed caller, uint256 exitMid, int256 returnBps)
      - name: VaultFactory
        address: ["0x056426DE47B68b55D9049F373a5bF72436D8ab49"]
        handler: src/EventHandlers.ts
        events:
          - event: VaultCreated(address indexed owner, address vault, uint256 maxExposure)
      - name: FollowVault # addresses registered dynamically from VaultCreated
        handler: src/EventHandlers.ts
        events:
          - event: Followed(uint256 indexed positionId, uint256 indexed callId, address indexed caller, uint256 amountIn, uint256 baseOut)
          - event: Closed(uint256 indexed positionId, uint256 indexed callId, address indexed caller, uint256 proceeds, int256 pnl, uint256 callerFee, uint256 protocolFee)
      - name: AttestedGate
        address: ["0x4894539218Fa5D838Bef29B7658f959aFB63F99b"]
        handler: src/EventHandlers.ts
        events:
          - event: Attested(address indexed account, uint64 until, bytes32 credentialRef)
